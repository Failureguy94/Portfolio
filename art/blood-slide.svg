<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blood-slide artwork for the hero reveal. Transparent layer: pool, splatter, slide. No text of the page, no background.
  Render with `npm run art` (scripts/make-blood-art.js) to public/art/blood-slide.{webp,png}.

  Editing notes
  - viewBox units = CSS px at a 1900px-wide hero. Pool centre (300,420), radius ~200. Keep src/lib/bloodArt.js in sync if you move things.
  - Double-brace tokens in the label are filled from src/data/profile.js by the render script. Do not type names in here.
  - Pool colours: #pool-fill stops. They are lighter than a "true" blood red on purpose, so the black
    hero name keeps at least 3:1 contrast over the pool (the render script measures this).
  - Edge roughness: #pool-filter feDisplacementMap scale. Clots: the second feTurbulence.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <!-- ============ pool ============ -->
    <radialGradient id="pool-fill" cx="0.47" cy="0.5" r="0.56">
      <stop offset="0" stop-color="#A9474D"/>
      <stop offset="0.55" stop-color="#AC4A50"/>
      <stop offset="1" stop-color="#B9575C"/>
    </radialGradient>

    <filter id="pool-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <!-- soft, irregular edge -->
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="11" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="38" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feGaussianBlur in="shape" stdDeviation="0.8" result="shapeSoft"/>

      <!-- clotted interior: turbulence alpha, kept away from the rim -->
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="3" result="clotNoise"/>
      <feColorMatrix in="clotNoise" type="matrix"
        values="0 0 0 0 0.56
                0 0 0 0 0.2
                0 0 0 0 0.22
                1.5 0 0 0 -0.68" result="clotTone"/>
      <feMorphology in="shapeSoft" operator="erode" radius="22" result="inner"/>
      <feGaussianBlur in="inner" stdDeviation="14" result="innerSoft"/>
      <feComposite in="clotTone" in2="innerSoft" operator="in" result="clot"/>

      <!-- very faint inner rim shadow -->
      <feGaussianBlur in="shapeSoft" stdDeviation="7" result="rimBlur"/>
      <feComposite in="shapeSoft" in2="rimBlur" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="rimMask"/>
      <feFlood flood-color="#6E2328" flood-opacity="0.32"/>
      <feComposite in2="rimMask" operator="in" result="rim"/>

      <feMerge>
        <feMergeNode in="shapeSoft"/>
        <feMergeNode in="clot"/>
        <feMergeNode in="rim"/>
      </feMerge>
    </filter>

    <filter id="gloss" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="drop-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- ============ slide ============ -->
    <linearGradient id="glass-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDF0EE" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#B9D4D2" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass-sheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="drop-fill" cx="0.5" cy="0.5" r="0.5" fx="0.4" fy="0.36">
      <stop offset="0" stop-color="#C41E2B"/>
      <stop offset="0.55" stop-color="#A00C19"/>
      <stop offset="1" stop-color="#6F0610"/>
    </radialGradient>
    <filter id="drop-mute" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      <feColorMatrix type="saturate" values="0.78"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="glint" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="frost" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.42
                0 0 0 0 0.38
                0 0 0 0.5 -0.18" result="speck"/>
      <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="speckIn"/>
      </feMerge>
    </filter>
    <clipPath id="slide-clip">
      <rect x="-297.5" y="-102.5" width="595" height="205" rx="7"/>
    </clipPath>
  </defs>

  <!-- ============ splatter: four tiny droplets ============ -->
  <g id="splatter" fill="#AE4C52">
    <circle cx="96" cy="262" r="5"/>
    <ellipse cx="74" cy="560" rx="4" ry="3.2" transform="rotate(-30 74 560)"/>
    <circle cx="556" cy="560" r="2.6"/>
    <circle cx="520" cy="402" r="3.4"/>
  </g>

  <!-- ============ pool ============ -->
  <g id="pool">
    <path filter="url(#pool-filter)" fill="url(#pool-fill)"
      d="M502.5 482.7C488.9 520.7 464.8 534.9 433.9 564.5C403.0 594.1 385.8 623.6 347.9 630.6C310.0 637.6 284.1 613.9 244.4 599.6C204.8 585.3 174.2 587.1 149.6 559.3C125.0 531.5 132.4 501.1 121.6 460.6C110.7 420.1 87.2 394.4 95.6 356.8C103.9 319.2 130.9 297.0 163.4 272.5C195.9 248.1 218.2 245.2 257.9 234.7C297.5 224.3 324.6 209.9 361.8 220.3C398.9 230.7 415.8 256.0 443.8 286.8C471.8 317.6 490.1 334.9 501.8 374.1C513.6 413.3 516.1 444.6 502.5 482.7Z"/>
    <!-- one short drip (about 45px) -->
    <path filter="url(#drop-edge)" fill="#B3525A"
      d="M318 616C324 616 327 622 326.5 632L325 652C324.6 658 322 662 318.5 662C315 662 312.4 658 312 652L310.5 632C310 622 312 616 318 616Z"/>
    <!-- single soft gloss -->
    <ellipse filter="url(#gloss)" cx="236" cy="330" rx="78" ry="34" transform="rotate(-28 236 330)" fill="#fff" opacity="0.12"/>
  </g>

  <!-- ============ slide (85% of the previous size, tilted) ============ -->
  <g id="slide" transform="translate(792 258) rotate(-3.5)">
    <!-- soft drop shadow -->
    <rect x="-292" y="-92" width="595" height="205" rx="9" fill="#3B1F18" opacity="0.2" filter="url(#soft-shadow)" transform="translate(6 10)"/>

    <!-- glass body -->
    <rect x="-297.5" y="-102.5" width="595" height="205" rx="7" fill="url(#glass-body)"/>

    <!-- blood drop under the cover slip -->
    <g filter="url(#drop-mute)">
      <circle cx="72" cy="2" r="58" fill="url(#drop-fill)"/>
    </g>
    <circle cx="72" cy="2" r="58" fill="none" stroke="#5E0A12" stroke-opacity="0.18" stroke-width="3"/>
    <circle cx="20" cy="-48" r="1.8" fill="#8A2028" opacity="0.7"/>
    <circle cx="150" cy="38" r="2.2" fill="#8A2028" opacity="0.7"/>

    <!-- cover slip -->
    <rect x="-60" y="-72" width="262" height="148" rx="2" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.75" stroke-width="1.5"/>

    <!-- small glint on the drop -->
    <ellipse filter="url(#glint)" cx="50" cy="-26" rx="15" ry="6" transform="rotate(-24 50 -26)" fill="#fff" opacity="0.55"/>

    <!-- diagonal sheen across the glass -->
    <rect clip-path="url(#slide-clip)" x="-297.5" y="-102.5" width="595" height="205" fill="url(#glass-sheen)"/>

    <!-- glass edge + bevel, then the white outer stroke -->
    <rect x="-297.5" y="-102.5" width="595" height="205" rx="7" fill="none" stroke="#7FB5B0" stroke-width="2"/>
    <rect x="-292" y="-97" width="584" height="194" rx="5" fill="none" stroke="#7FB5B0" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="-299.5" y="-104.5" width="599" height="209" rx="8.5" fill="none" stroke="#fff" stroke-width="2.5"/>

    <!-- frosted label -->
    <g id="label">
      <rect filter="url(#frost)" x="-290" y="-95" width="130" height="190" rx="2" fill="#F6F1E4" fill-opacity="0.95"/>
      <rect x="-290" y="-95" width="130" height="190" rx="2" fill="none" stroke="#1C1A17" stroke-opacity="0.08"/>
      <g font-family="'Special Elite', 'Courier New', monospace" fill="#1C1A17">
        <text x="-280" y="-72" font-size="10.5" letter-spacing="1.4">{{specimen}}</text>
        <line x1="-280" y1="-64" x2="-170" y2="-64" stroke="#1C1A17" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="-280" y="-42" font-size="16.5">{{name}}</text>
        <text x="-280" y="-16" font-size="10.5" letter-spacing="0.4">{{college}}</text>
        <text x="-280" y="0" font-size="10.5" letter-spacing="0.4">{{degree}}</text>
        <text x="-280" y="16" font-size="10.5" letter-spacing="0.4">{{batch}}</text>
        <line x1="-280" y1="32" x2="-170" y2="32" stroke="#1C1A17" stroke-width="0.8" stroke-opacity="0.55" stroke-dasharray="2 2.5"/>
        <text x="-280" y="54" font-size="11" letter-spacing="0.5" fill="#8A0A15">{{status1}}</text>
        <text x="-280" y="69" font-size="11" letter-spacing="0.5" fill="#8A0A15">{{status2}}</text>
      </g>
    </g>
  </g>
</svg>
