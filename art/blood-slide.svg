<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blood-slide artwork for the hero reveal. Transparent layer: blood pool, a silhouetted figure holding a
  microscope slide. No page text, no background.
  Render with `npm run art` (scripts/make-blood-art.js) to public/art/blood-slide.{webp,png}.

  Editing notes
  - viewBox units = CSS px at a 1900px-wide hero. The hero name's first line starts at (56, 368).
    Keep src/lib/bloodArt.js in sync if you move things.
  - The pool is a bitmap (blood-pool.png), lifted from the draft mock-up by scripts/extract-blood-pool.py.
  - Double-brace tokens in the label are filled from src/data/profile.js by the render script. Do not type names in here.
  - The figure is an original solid-black silhouette with no facial detail. It fades out above the
    hero name (#figure-fade) so it never sits behind the black headline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" width="1480" height="760">
  <defs>
    <!-- ============ figure ============ -->
    <linearGradient id="figure-fade-grad" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="366">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="figure-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1480" height="760">
      <rect width="1480" height="760" fill="url(#figure-fade-grad)"/>
    </mask>

    <!-- ============ slide ============ -->
    <linearGradient id="glass-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDF0EE" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#B9D4D2" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass-sheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.66" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="drop-fill" cx="0.5" cy="0.5" r="0.5" fx="0.4" fy="0.36">
      <stop offset="0" stop-color="#C41E2B"/>
      <stop offset="0.55" stop-color="#A00C19"/>
      <stop offset="1" stop-color="#6F0610"/>
    </radialGradient>
    <filter id="drop-mute" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      <feColorMatrix type="saturate" values="0.78"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="glint" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="frost" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.42
                0 0 0 0 0.38
                0 0 0 0.5 -0.18" result="speck"/>
      <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="speckIn"/>
      </feMerge>
    </filter>
    <clipPath id="slide-clip">
      <rect x="-297.5" y="-102.5" width="595" height="205" rx="7"/>
    </clipPath>
  </defs>

  <!-- ============ pool (from the draft) ============ -->
  <image id="pool" href="blood-pool.png" x="48" y="67" width="773" height="665"/>

  <!-- ============ figure, behind the slide: head and the hand's fingers ============ -->
  <g id="figure" fill="#000" mask="url(#figure-fade)">
    <g transform="translate(268 93) scale(0.8)">
      <path id="head" d="M1300 40C1340 38 1378 58 1395 95C1412 135 1410 190 1392 228C1380 255 1365 272 1358 300L1356 350C1390 362 1440 372 1470 400L1480 470L1150 470C1165 430 1200 395 1250 352L1246 305C1236 296 1222 290 1214 284C1204 280 1197 272 1196 263C1195 255 1199 250 1200 246C1196 241 1192 238 1193 233C1194 229 1198 227 1198 225C1195 222 1191 220 1192 216C1193 212 1197 209 1197 206C1190 204 1180 200 1177 195C1176 190 1180 184 1186 172C1192 160 1197 154 1197 150C1194 146 1192 142 1194 138C1198 124 1200 112 1203 100C1208 80 1220 62 1240 52C1258 44 1280 40 1300 40Z"/>
      <path id="hand" transform="translate(-25 0)" d="M1112 345C1104 318 1096 296 1090 272C1082 252 1066 232 1052 212C1040 196 1034 178 1038 160C1041 144 1050 128 1062 118C1072 110 1084 112 1090 122C1100 140 1112 158 1126 172C1140 188 1156 205 1164 228C1172 256 1174 290 1168 318L1178 470L1118 470Z"/>
    </g>
  </g>

  <!-- ============ slide, held at its right end ============ -->
  <g id="slide" transform="translate(901 235) rotate(-6) scale(0.7)">
    <!-- soft drop shadow -->
    <rect x="-292" y="-92" width="595" height="205" rx="9" fill="#3B1F18" opacity="0.2" filter="url(#soft-shadow)" transform="translate(6 10)"/>

    <!-- glass body -->
    <rect x="-297.5" y="-102.5" width="595" height="205" rx="7" fill="url(#glass-body)"/>

    <!-- blood drop under the cover slip -->
    <g filter="url(#drop-mute)">
      <circle cx="72" cy="2" r="58" fill="url(#drop-fill)"/>
    </g>
    <circle cx="72" cy="2" r="58" fill="none" stroke="#5E0A12" stroke-opacity="0.18" stroke-width="3"/>
    <circle cx="20" cy="-48" r="1.8" fill="#8A2028" opacity="0.7"/>
    <circle cx="150" cy="38" r="2.2" fill="#8A2028" opacity="0.7"/>

    <!-- cover slip -->
    <rect x="-60" y="-72" width="262" height="148" rx="2" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.75" stroke-width="1.5"/>

    <!-- small glint on the drop -->
    <ellipse filter="url(#glint)" cx="50" cy="-26" rx="15" ry="6" transform="rotate(-24 50 -26)" fill="#fff" opacity="0.55"/>

    <!-- diagonal sheen across the glass -->
    <rect clip-path="url(#slide-clip)" x="-297.5" y="-102.5" width="595" height="205" fill="url(#glass-sheen)"/>

    <!-- glass edge + bevel, then the white outer stroke -->
    <rect x="-297.5" y="-102.5" width="595" height="205" rx="7" fill="none" stroke="#7FB5B0" stroke-width="2"/>
    <rect x="-292" y="-97" width="584" height="194" rx="5" fill="none" stroke="#7FB5B0" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="-299.5" y="-104.5" width="599" height="209" rx="8.5" fill="none" stroke="#fff" stroke-width="2.5"/>

    <!-- frosted label -->
    <g id="label">
      <rect filter="url(#frost)" x="-290" y="-95" width="130" height="190" rx="2" fill="#F6F1E4" fill-opacity="0.95"/>
      <rect x="-290" y="-95" width="130" height="190" rx="2" fill="none" stroke="#1C1A17" stroke-opacity="0.08"/>
      <g font-family="'Special Elite', 'Courier New', monospace" fill="#1C1A17">
        <text x="-280" y="-72" font-size="10.5" letter-spacing="1.4">{{specimen}}</text>
        <line x1="-280" y1="-64" x2="-170" y2="-64" stroke="#1C1A17" stroke-width="0.8" stroke-opacity="0.6"/>
        <text x="-280" y="-42" font-size="16.5">{{name}}</text>
        <text x="-280" y="-16" font-size="10.5" letter-spacing="0.4">{{college}}</text>
        <text x="-280" y="0" font-size="10.5" letter-spacing="0.4">{{degree}}</text>
        <text x="-280" y="16" font-size="10.5" letter-spacing="0.4">{{batch}}</text>
        <line x1="-280" y1="32" x2="-170" y2="32" stroke="#1C1A17" stroke-width="0.8" stroke-opacity="0.55" stroke-dasharray="2 2.5"/>
        <text x="-280" y="54" font-size="11" letter-spacing="0.5" fill="#8A0A15">{{status1}}</text>
        <text x="-280" y="69" font-size="11" letter-spacing="0.5" fill="#8A0A15">{{status2}}</text>
      </g>
    </g>
  </g>

  <!-- ============ figure, in front of the slide: the thumb ============ -->
  <g fill="#000" mask="url(#figure-fade)">
    <path id="thumb" transform="translate(268 93) scale(0.8) translate(-25 0)" d="M1098 268C1086 248 1070 222 1060 200C1054 188 1054 176 1062 172C1072 168 1080 176 1086 186C1098 206 1112 228 1124 250Z"/>
  </g>
</svg>
